<div
  style="
    font-family: Arial, Helvetica, sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 24px;
    color: #1a1d1b;
  "
>
  <h2 style="margin: 0 0 16px">Recupera tu contraseña</h2>
  <p style="line-height: 1.5">
    Pediste cambiar la contraseña de tu cuenta de PlatAnt. Toca el botón para elegir una nueva. El
    enlace sirve durante una hora.
  </p>
  <p style="margin: 24px 0">
    <a
      href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/nueva-contrasena"
      style="
        background: #b1f03c;
        color: #0a0c0b;
        padding: 14px 24px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: bold;
        display: inline-block;
      "
      >Cambiar contraseña</a
    >
  </p>
  <p style="line-height: 1.5; color: #5c645f; font-size: 14px">
    Si no fuiste tú, ignora este correo: tu contraseña sigue igual.
  </p>
</div>
